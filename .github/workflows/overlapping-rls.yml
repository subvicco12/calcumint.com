name: Overlapping RLS behavior

on:
  pull_request:
    paths:
      - "supabase/migrations/001_b3_accounts.sql"
      - "supabase/migrations/002_b4_billing.sql"
      - "supabase/migrations/003_b5_business.sql"
      - "supabase/migrations/004_b6_builder.sql"
      - "supabase/migrations/005_b7_delivery.sql"
      - "supabase/migrations/006_b8_api_automation.sql"
      - "supabase/migrations/007_b9_ai.sql"
      - "supabase/migrations/008_b10_admin_factory.sql"
      - "supabase/migrations/030_billing_ai_rls_auth_initplan.sql"
      - "supabase/migrations/032_business_builder_rls_auth_initplan.sql"
      - "supabase/migrations/035_split_overlapping_write_policies.sql"
      - "supabase/migrations/036_consolidate_ai_usage_read_policy.sql"
      - "supabase/migrations/037_builder_publish_business_entitlement.sql"
      - "tests/overlapping-rls.sql"
      - ".github/workflows/overlapping-rls.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/001_b3_accounts.sql"
      - "supabase/migrations/002_b4_billing.sql"
      - "supabase/migrations/003_b5_business.sql"
      - "supabase/migrations/004_b6_builder.sql"
      - "supabase/migrations/005_b7_delivery.sql"
      - "supabase/migrations/006_b8_api_automation.sql"
      - "supabase/migrations/007_b9_ai.sql"
      - "supabase/migrations/008_b10_admin_factory.sql"
      - "supabase/migrations/030_billing_ai_rls_auth_initplan.sql"
      - "supabase/migrations/032_business_builder_rls_auth_initplan.sql"
      - "supabase/migrations/035_split_overlapping_write_policies.sql"
      - "supabase/migrations/036_consolidate_ai_usage_read_policy.sql"
      - "supabase/migrations/037_builder_publish_business_entitlement.sql"
      - "tests/overlapping-rls.sql"
      - ".github/workflows/overlapping-rls.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  behavioral-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Run overlapping RLS behavior checks
        run: psql -h 127.0.0.1 -U postgres -d postgres -f tests/overlapping-rls.sql
