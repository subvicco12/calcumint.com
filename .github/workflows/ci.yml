name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: GrowthOS heartbeat syntax
        run: node --check scripts/growthos-heartbeat.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Pull pinned isolated database fixtures
        run: |
          docker pull postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          docker pull postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
      - name: Isolated PostgreSQL HTTP security contract
        run: node tests/next-runtime/security.mjs
        env:
          NEXT_RUNTIME_ARTIFACTS: ${{ runner.temp }}/next-runtime-security
      - name: Provision pinned isolated browser fixture
        timeout-minutes: 4
        run: |
          browser=$(sh scripts/install-ci-browser.sh "$RUNNER_TEMP")
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Isolated browser transport recovery
        run: |
          test -x "$CHROMIUM_PATH"
          node --test --test-reporter=spec tests/next-runtime/browser-fixture.test.mjs tests/next-runtime/owner-preview-readiness.test.mjs
          node --test --test-reporter=spec tests/next-runtime/cdp.test.mjs
        env:
          CDP_STARTUP_DIAGNOSTICS: '1'
      - name: Actual Next.js Business runtime acceptance
        run: |
          test -x "$CHROMIUM_PATH"
          node scripts/test-next-runtime-browser.mjs
        env:
          NEXT_RUNTIME_ARTIFACTS: ${{ runner.temp }}/next-runtime-browser
          CDP_STARTUP_DIAGNOSTICS: '1'
      - name: Private supplied workflow browser acceptance
        run: node tests/workflow-review/browser.mjs
        env:
          CALCUMINT_WORKFLOW_EVIDENCE: ${{ runner.temp }}/private-workflow-browser
      - name: Source-bound profile and plan-parity browser acceptance
        run: node tests/source-profile-review/browser.mjs
        env:
          CALCUMINT_SOURCE_PROFILE_EVIDENCE: ${{ runner.temp }}/source-profile-browser
      - name: Private financial contracts and plan-parity browser acceptance
        run: node tests/financial-contract-review/browser.mjs
        env:
          CALCUMINT_FINANCIAL_EVIDENCE: ${{ runner.temp }}/financial-contract-browser
      - name: Private final calculator discovery and immutable replay
        run: node tests/final-private-workbench/browser.mjs
        env:
          CALCUMINT_WORKBENCH_EVIDENCE: ${{ runner.temp }}/final-private-workbench
      - name: Full catalog engineering and private business acceptance
        run: node tests/catalog-engineering-review/browser.mjs
        env:
          CALCUMINT_CATALOG_ENGINEERING_EVIDENCE: ${{ runner.temp }}/catalog-engineering
      - name: Private loan and conversion contracts browser acceptance
        run: node tests/component-engineering-review/browser.mjs
        env:
          CALCUMINT_COMPONENT_ENGINEERING_EVIDENCE: ${{ runner.temp }}/component-engineering
      - name: Remaining private calculator contracts and calendar acceptance
        run: node tests/remaining-engineering-review/browser.mjs
        env:
          CALCUMINT_REMAINING_ENGINEERING_EVIDENCE: ${{ runner.temp }}/remaining-engineering
      - name: Native UK2026 electricity source and private component acceptance
        run: |
          python3 scripts/verify-uk-2026-electricity-source.py --check
          node tests/uk-2026-electricity-review/browser.mjs
        env:
          CALCUMINT_ELECTRICITY_EVIDENCE: ${{ runner.temp }}/uk-2026-electricity
  source-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Pull pinned isolated database fixtures
        run: |
          docker pull postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          docker pull postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
      - name: Provision pinned isolated browser fixture
        timeout-minutes: 4
        run: |
          browser=$(sh scripts/install-ci-browser.sh "$RUNNER_TEMP")
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Require independent PDF reader and renderer
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdffonts >/dev/null || ! command -v pdftoppm >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          node scripts/assert-pdf-tools.mjs
      - name: Unit tests
        run: npm test
      - name: Launch certification
        run: npm run test:launch
      - name: Calculator and rule-pack certification
        run: npm run test:certification
      - name: Synthetic Reference Six browser acceptance
        run: |
          test -x "$CHROMIUM_PATH"
          npm run test:final-reference-browser
        env:
          FINAL_REFERENCE_ARTIFACTS: ${{ runner.temp }}/final-reference-browser
      - name: Isolated Business browser acceptance
        run: |
          test -x "$CHROMIUM_PATH"
          node scripts/test-business-browser.mjs
        env:
          BUSINESS_BROWSER_ARTIFACTS: ${{ runner.temp }}/business-browser
      - name: Source-package integrity and fail-closed CI recovery guards
        run: |
          python3 scripts/verify-partial16-source.py --check
          node --test tests/ci-gate-recovery/*.test.mjs
      - name: Conditional private source contracts and immutable browser acceptance
        run: |
          python3 scripts/verify-conditional-source.py
          node tests/conditional-authority-review/browser.mjs
        env:
          CONDITIONAL_EVIDENCE: ${{ runner.temp }}/conditional-source-contracts
      - name: Six captured-source contracts and immutable browser acceptance
        run: |
          python3 scripts/verify-remaining-six-source.py
          node tests/remaining-authority-review/browser.mjs
        env:
          REMAINING_SIX_EVIDENCE: ${{ runner.temp }}/remaining-six-source-contracts
      - name: Fetch immutable native Blueprint candidate source
        run: git fetch --no-tags --depth=1 origin 50f307c67e3a5e5d289d2b83e2a285029151f866
      - name: Original Blueprint scope and exact runtime receipts
        run: |
          python3 scripts/reconcile-native-blueprint.py --check
          python3 tests/blueprint-reconciliation/native.test.py
          node --test tests/blueprint-reconciliation/*.test.mjs
      - name: Fetch immutable canonical evidence source
        run: git fetch --no-tags --depth=1 origin 7eff39b23a52953c028852d50d5571211a3f8a44
      - name: Canonical ledger and analytical successor acceptance
        run: |
          node scripts/canonical-acceptance-evidence.mjs docs/canonical-acceptance --check
          node tests/canonical-acceptance-review/browser.mjs
        env:
          CANONICAL_EVIDENCE: ${{ runner.temp }}/canonical-acceptance
      - name: Declared-domain calculus source, replay and typed browser acceptance
        run: |
          python3 scripts/reconcile-canonical-calculus.py --check
          node --test tests/canonical-calculus-workbench/frozen-source.test.mjs
          node tests/canonical-calculus-workbench/browser.mjs
        env:
          CALCULUS_EVIDENCE: ${{ runner.temp }}/canonical-calculus
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://calcumint.com
      - name: Provision pinned isolated browser for contract acceptance
        timeout-minutes: 4
        run: |
          browser=$(sh scripts/install-ci-browser.sh "$RUNNER_TEMP")
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Reusable private canonical contract evidence and browser acceptance
        run: |
          python3 scripts/canonical-validation-source.py --check
          node scripts/canonical-validation-evidence.mjs --check
          node tests/canonical-validation/browser.mjs
          node tests/canonical-validation/workflow-browser.mjs
        env:
          VALIDATION_EVIDENCE: ${{ runner.temp }}
      - name: Expanded immutable validation revision and source acceptance
        run: |
          python3 scripts/scale-validation-source.py --check
          python3 tests/validation-scale/source.test.py
          node scripts/scale-validation-evidence.mjs --check
          node tests/validation-scale/browser.mjs
          node tests/validation-scale/workflow-browser.mjs
        env:
          SCALE_EVIDENCE: ${{ runner.temp }}
  full-product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Pull pinned isolated database fixtures
        run: |
          docker pull postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          docker pull postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
          docker pull supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
      - name: Provision pinned isolated browser fixture
        timeout-minutes: 4
        run: |
          browser=$(sh scripts/install-ci-browser.sh "$RUNNER_TEMP")
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Exact 540-row engineering delta integrity
        run: python3 scripts/full-product-batch12-evidence.py --check
      - name: Private full-product functional acceptance
        run: node tests/full-product-batch12/private-browser.mjs
        env:
          BATCH12_PRIVATE_ARTIFACTS: ${{ runner.temp }}/batch12-private
      - name: Installed SDK synthetic fixture CORS acceptance
        run: node --test tests/next-runtime/auth-fixture-cors.test.mjs
      - name: Owned history exports and scenario recovery acceptance
        run: node tests/full-product-batch12/account-browser.mjs
        env:
          BATCH12_ACCOUNT_ARTIFACTS: ${{ runner.temp }}/batch12-account
      - name: Exact Batch13 540-ID requirement deltas
        run: |
          git fetch --no-tags --depth=1 origin e2b4a3d2e65f3887ce1b53240f01847d9b4348f3
          node scripts/check-batch13-evidence.mjs
          node --test tests/full-product-batch13/workflow.test.mjs
      - name: Batch13 private sensitivity and module transport acceptance
        run: |
          node --test tests/next-runtime/cdp-network-diagnostics.test.mjs
          node tests/full-product-batch13/private-browser.mjs
        env:
          BATCH13_PRIVATE_ARTIFACTS: ${{ runner.temp }}/batch13-private
      - name: Genuine isolated GoTrue and schema acceptance
        run: node tests/gotrue-runtime/acceptance.mjs
        env:
          GOTRUE_ARTIFACTS: ${{ runner.temp }}/batch13-gotrue
      - name: Batch14 identity and contract evidence preparation
        run: |
          node_modules/.bin/vite-node --config vitest.config.ts scripts/prepare-canonical-contract-evidence.ts --check
          git fetch --no-tags --depth=1 origin b96b1ac89971cb8418d2389fbd7c9571a57491f1
          node scripts/check-batch14-evidence.mjs
          node --test tests/full-product-batch14/historical-batch14-evidence.test.mjs
          node --test tests/full-product-batch14/workflow.test.mjs
      - name: Batch14 accessible private sensitivity and scenario report replay
        run: |
          node tests/full-product-batch14/private-accessibility-browser.mjs
          node tests/full-product-batch14/report-recovery-browser.mjs
        env:
          BATCH14_PRIVATE_ACCESSIBILITY_ARTIFACTS: ${{ runner.temp }}/batch14-accessibility
          BATCH14_REPORT_ARTIFACTS: ${{ runner.temp }}/batch14-report
      - name: Genuine full repository schema and Business authorization
        run: node tests/gotrue-full-schema/acceptance.mjs
        env:
          GOTRUE_FULL_ARTIFACTS: ${{ runner.temp }}/batch14-gotrue-full
          BATCH16_AUTH: '1'
      - name: Software closure evidence and recovery lifecycle browser acceptance
        run: |
          node scripts/software-closure-evidence.mjs --check
          node --test tests/software-closure/ci-workflow.test.mjs
          node tests/calculus-recovery-workbench/browser.mjs
          node tests/software-closure/recovery-browser.mjs
        env:
          SOFTWARE_CLOSURE_ARTIFACTS: ${{ runner.temp }}/software-closure
          CALCULUS_RECOVERY_EVIDENCE: ${{ runner.temp }}/calculus-recovery
      - name: Batch16 requirement, schema comparison and finder acceptance
        run: |
          node_modules/.bin/vite-node --config vitest.config.ts scripts/batch16-requirement-evidence.ts --check
          node scripts/batch16-contract-groups.mjs --check
          node scripts/batch16-authority-requests.mjs --check
          node --test tests/batch16-auth/schema-comparison.test.mjs tests/full-product-batch16/workflow.test.mjs
          node tests/gotrue-runtime/acceptance.mjs
          node tests/full-product-batch16/finder-browser.mjs
        env:
          BATCH16_FULL_SCHEMA: '1'
          GOTRUE_ARTIFACTS: ${{ runner.temp }}/batch16-full-schema-browser
          BATCH16_FINDER_ARTIFACTS: ${{ runner.temp }}/batch16-finder
  validate:
    runs-on: ubuntu-latest
    needs: [checks, build, full-product, source-acceptance]
    if: ${{ always() }}
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          FULL_PRODUCT_RESULT: ${{ needs.full-product.result }}
          SOURCE_ACCEPTANCE_RESULT: ${{ needs.source-acceptance.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$FULL_PRODUCT_RESULT" = success
          test "$SOURCE_ACCEPTANCE_RESULT" = success
