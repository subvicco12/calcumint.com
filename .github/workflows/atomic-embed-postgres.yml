name: Atomic embed PostgreSQL proposal
on:
  pull_request:
    paths:
      - 'tests/api-schema/**'
      - 'supabase/migrations/001_b3_accounts.sql'
      - 'supabase/migrations/003_b5_business.sql'
      - 'supabase/migrations/004_b6_builder.sql'
      - 'supabase/migrations/029_account_rls_auth_initplan.sql'
      - 'supabase/migrations/032_business_builder_rls_auth_initplan.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/builder/**'
      - 'src/lib/supabase/admin.ts'
      - 'docs/architecture/proposals/ATOMIC-EMBED-LEAD-CONSENT.sql'
      - 'docs/architecture/proposals/ATOMIC-API-QUOTA.sql'
      - 'src/lib/api/auth*'
      - 'tests/api-embed/**'
      - 'src/app/api/embed/**'
      - 'src/lib/embeds/**'
      - 'src/app/api/v1/batch/**'
      - 'src/components/public-embed-calculator*'
      - 'supabase/migrations/005_b7_delivery.sql'
      - 'supabase/migrations/006_b8_api_automation.sql'
      - '.github/workflows/atomic-embed-postgres.yml'
permissions:
  contents: read
jobs:
  atomic-embed-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies for real HTTP transport tests
        run: npm ci
      - name: Test guarded proposal in disposable PostgreSQL
        run: node tests/api-embed/atomic-postgres.mjs
