name: Pro workspace RLS behavior

on:
  pull_request:
    paths:
      - "supabase/migrations/010_b7_pro_workspace.sql"
      - "supabase/migrations/033_pro_workspace_rls_auth_initplan.sql"
      - "tests/pro-workspace-rls.sql"
      - ".github/workflows/pro-workspace-rls.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/010_b7_pro_workspace.sql"
      - "supabase/migrations/033_pro_workspace_rls_auth_initplan.sql"
      - "tests/pro-workspace-rls.sql"
      - ".github/workflows/pro-workspace-rls.yml"

permissions:
  contents: read

jobs:
  behavioral-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Run Pro workspace RLS behavior checks
        run: psql -h 127.0.0.1 -U postgres -d postgres -f tests/pro-workspace-rls.sql
