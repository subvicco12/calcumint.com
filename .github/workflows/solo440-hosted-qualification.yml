name: Socket-free calculator and owner-v2 qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  postgres-contract:
    if: >-
      github.repository == 'subvicco12/calcumint.com' &&
      github.ref == 'refs/heads/engineering/solo440-owner-v2-execution' &&
      github.ref_protected && github.actor == 'subvicco12' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: calcumint-source-bootstrap-runtime
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55433:5432'
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TRUSTED_WORKFLOW_SHA: ${{ vars.CALCUMINT_SOLO440_HOSTED_WORKFLOW_SHA }}
    steps:
      - name: Verify exact independently configured qualification revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$TRUSTED_WORKFLOW_SHA" && "$GITHUB_WORKFLOW_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/solo440-hosted-qualification.yml@$GITHUB_REF" ]]
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Bind provider-managed disposable PostgreSQL identity
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$POSTGRES_SERVICE_ID" =~ ^[0-9a-f]{64}$ ]]
          psql -X -h 127.0.0.1 -p 55433 -U postgres -d postgres -v ON_ERROR_STOP=1 -v run_id="$GITHUB_RUN_ID" -v workflow_sha="$GITHUB_WORKFLOW_SHA" -v service_id="$POSTGRES_SERVICE_ID" <<'SQL'
          CREATE SCHEMA calcumint_disposable;
          REVOKE ALL ON SCHEMA calcumint_disposable FROM PUBLIC;
          CREATE TABLE calcumint_disposable.identity(run_id text NOT NULL, workflow_sha text NOT NULL, service_id text NOT NULL);
          INSERT INTO calcumint_disposable.identity VALUES(:'run_id',:'workflow_sha',:'service_id');
          REVOKE ALL ON calcumint_disposable.identity FROM PUBLIC;
          SQL
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'solo440-postgres.json'
          p.write_text(json.dumps({'kind':'CALCUMINT_DISPOSABLE_POSTGRES_V1','runId':os.environ['GITHUB_RUN_ID'],'workflowSha':os.environ['GITHUB_WORKFLOW_SHA'],'attempt':1,'postgres':{'host':'127.0.0.1','port':55433,'database':'postgres'},'serviceIds':{'postgres':os.environ['POSTGRES_SERVICE_ID']}}));p.chmod(0o600)
          PY
      - name: Qualify actual PostgreSQL concurrency and uncertain outcomes
        env:
          SOLO440_SERVICE_CONFIG: ${{ runner.temp }}/solo440-postgres.json
        run: python3 -I tools/solo440-v2/qualify_postgres.py > "$RUNNER_TEMP/postgres-qualification.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: solo440-postgres-qualification
          path: ${{ runner.temp }}/postgres-qualification.json
          if-no-files-found: error
  mass426-authenticated:
    if: >-
      github.repository == 'subvicco12/calcumint.com' &&
      github.ref == 'refs/heads/engineering/solo440-owner-v2-execution' &&
      github.ref_protected && github.actor == 'subvicco12' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: calcumint-source-bootstrap-runtime
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55432:5432'
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
      gotrue:
        image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
        env:
          GOTRUE_API_HOST: 0.0.0.0
          GOTRUE_API_PORT: '9999'
          API_EXTERNAL_URL: http://127.0.0.1:9999
          GOTRUE_SITE_URL: http://localhost:3000
          GOTRUE_DB_DRIVER: postgres
          GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin@postgres:5432/postgres?sslmode=disable
          GOTRUE_JWT_SECRET: calcumint-disposable-only-not-production-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GOTRUE_JWT_AUD: authenticated
          GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
          GOTRUE_JWT_ADMIN_ROLES: service_role
          GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
          GOTRUE_MAILER_AUTOCONFIRM: 'true'
          GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
          GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: '0'
        ports:
          - '127.0.0.1:9999:9999'
        options: --restart=on-failure:10
      postgrest:
        image: postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
        env:
          PGRST_DB_URI: postgres://postgres@postgres:5432/postgres
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: calcumint-disposable-only-not-production-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        ports:
          - '127.0.0.1:13000:3000'
        options: --restart=on-failure:10
    env:
      TRUSTED_WORKFLOW_SHA: ${{ vars.CALCUMINT_SOLO440_HOSTED_WORKFLOW_SHA }}
    steps:
      - name: Verify exact independently configured qualification revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$TRUSTED_WORKFLOW_SHA" && "$GITHUB_WORKFLOW_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/solo440-hosted-qualification.yml@$GITHUB_REF" ]]
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: cd03c0506e1e003a1af24acbf39974af6e3d63ed
          persist-credentials: false
          path: app
      - name: Initialize disposable authentication role before service retry
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: psql -X -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -v run_id="$GITHUB_RUN_ID" -v workflow_sha="$GITHUB_WORKFLOW_SHA" -v service_id="$POSTGRES_SERVICE_ID" -f app/tests/gotrue-services/bootstrap.sql
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Verify unchanged pinned Node executable
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 94efd062ed066c1a0b332e18249859c905e920eeada5df55d24c99b919629a90 "$(command -v node)" | sha256sum -c -
      - name: Prepare private service config and unprivileged application workspace
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          GOTRUE_SERVICE_ID: ${{ job.services.gotrue.id }}
          POSTGREST_SERVICE_ID: ${{ job.services.postgrest.id }}
          POSTGRES_PORT: '55432'
          GOTRUE_PORT: '9999'
          POSTGREST_PORT: '13000'
          DISPOSABLE_JWT_SECRET: calcumint-disposable-only-not-production-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        shell: bash
        run: |
          set -euo pipefail
          command -v pdftotext
          command -v google-chrome
          python3 app/tests/gotrue-services/write-config.py "$RUNNER_TEMP/mass426-services.json"
          mkdir -p "$RUNNER_TEMP/mass426-evidence" "$RUNNER_TEMP/mass426-home"
          sudo chown -R 65534:65534 app "$RUNNER_TEMP/mass426-evidence" "$RUNNER_TEMP/mass426-home" "$RUNNER_TEMP/mass426-services.json"
      - name: Run unchanged mass426 driver without Docker or provider credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo -n setpriv --reuid=65534 --regid=65534 --clear-groups --no-new-privs env -i \
            PATH="$PATH" HOME="$RUNNER_TEMP/mass426-home" \
            APP_SOURCE="$GITHUB_WORKSPACE/app" GITHUB_ACTIONS=true \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            CALCUMINT_REQUIRE_SOCKET_FREE=true CALCUMINT_SERVICE_CONFIG="$RUNNER_TEMP/mass426-services.json" \
            WORKER2_MOBILITY_BROWSER_ARTIFACTS="$RUNNER_TEMP/mass426-evidence" \
            CHROMIUM_PATH=/usr/bin/google-chrome \
            bash app/tests/gotrue-services/run-unprivileged.sh
      - name: Remove only the disposable local service config
        if: always()
        run: sudo rm -f "$RUNNER_TEMP/mass426-services.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mass426-authenticated-acceptance
          path: ${{ runner.temp }}/mass426-evidence
          if-no-files-found: error
  provider-readback:
    if: >-
      github.repository == 'subvicco12/calcumint.com' &&
      github.ref == 'refs/heads/engineering/solo440-owner-v2-execution' &&
      github.ref_protected && github.actor == 'subvicco12' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: calcumint-source-bootstrap-runtime
    env:
      TRUSTED_WORKFLOW_SHA: ${{ vars.CALCUMINT_SOLO440_HOSTED_WORKFLOW_SHA }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify authenticated provider readback without source admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_DRIVE_TOKEN: ${{ secrets.CALCUMINT_BOOTSTRAP_DRIVE_TOKEN }}
        run: python3 -I tools/solo440-v2/provider.py --verify-only --output "$RUNNER_TEMP/solo440-provider-readback.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solo440-provider-readback
          path: ${{ runner.temp }}/solo440-provider-readback.json
          if-no-files-found: error
