name: Private DRAFT persistence PostgreSQL acceptance
on:
  pull_request:
    paths:
      - 'tests/draft-preview/**'
      - 'docs/architecture/proposals/ATOMIC-ACCOUNT-HISTORY.sql'
      - 'src/app/account/actions.ts'
      - 'src/components/calculator-account-actions.tsx'
      - 'src/components/account-mutation-form.tsx'
      - 'src/app/account/drafts/**'
      - 'src/lib/draft-*'
      - 'src/lib/account-persistence.ts'
      - 'src/components/authenticated-draft-workspace*'
      - 'src/components/draft-calculator-preview*'
      - 'src/calculators/**/draft-master-*.ts'
      - 'src/calculators/core/draft-exact-decimal.ts'
      - 'src/calculators/final-framework/draft-*.ts'
      - 'src/lib/persisted-calculation.ts'
      - 'supabase/migrations/001_b3_accounts.sql'
      - 'supabase/migrations/002_b4_billing.sql'
      - 'supabase/migrations/008_b10_admin_factory.sql'
      - 'supabase/migrations/011_b8_free_save_quotas.sql'
      - 'supabase/migrations/038_client_account_billing_privileges.sql'
      - 'supabase/migrations/010_b7_pro_workspace.sql'
      - 'supabase/migrations/029_account_rls_auth_initplan.sql'
      - 'supabase/migrations/033_pro_workspace_rls_auth_initplan.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/draft-persistence-postgres.yml'
permissions:
  contents: read
jobs:
  draft-persistence-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare pinned disposable PostgreSQL image
        run: docker pull postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      - name: Prepare pinned disposable PostgREST image
        run: docker pull postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
      - name: Test private DRAFT snapshots and owner RLS without production access
        run: npm run test:draft-persistence-postgres
      - name: Test atomic history quotas, HTTP transport and owner fencing
        run: npm run test:atomic-history-postgres
