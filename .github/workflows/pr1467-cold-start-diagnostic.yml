name: PR1467 isolated cold-start diagnostic
on:
  push:
    branches: [diagnostics/pr1467-cold-start-20261022]
permissions:
  contents: read
jobs:
  cold-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        fixture: [image, materialized]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run typecheck
      - name: Same pinned disposable security prelude
        run: |
          docker pull postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          docker pull postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
          node tests/next-runtime/security.mjs
        env:
          NEXT_RUNTIME_ARTIFACTS: ${{ runner.temp }}/cold-start-security
      - name: Materialize identical isolated browser fixture when selected
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          if [ "$FIXTURE" = materialized ]; then
            timeout 60s python3 - <<'PYTHON'
          import os, shutil, time
          started=time.monotonic()
          source=os.path.dirname(os.path.realpath(shutil.which('chromium')))
          target=os.path.join(os.environ['RUNNER_TEMP'],'materialized-chromium')
          shutil.copytree(source,target,symlinks=True)
          print('Fixture materialization seconds:',round(time.monotonic()-started,3))
          PYTHON
          fi
      - name: First browser launch with unchanged startup deadline
        env:
          FIXTURE: ${{ matrix.fixture }}
          CDP_STARTUP_DIAGNOSTICS: '1'
        run: |
          export CHROMIUM_PATH="$(command -v chromium)"
          if [ "$FIXTURE" = materialized ]; then
            export CHROMIUM_PATH="$RUNNER_TEMP/materialized-chromium/$(basename "$(readlink -f "$CHROMIUM_PATH")")"
          fi
          "$CHROMIUM_PATH" --version
          df -h /tmp /dev/shm
          node --test --test-reporter=spec tests/next-runtime/cdp.test.mjs
