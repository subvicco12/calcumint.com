name: PR1467 isolated cold-start diagnostic
on:
  push:
    branches: [diagnostics/pr1467-cold-start-20261022]
permissions:
  contents: read
jobs:
  cold-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        preload: [false, true]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run typecheck
      - name: Same pinned disposable security prelude
        run: |
          docker pull postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          docker pull postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
          node tests/next-runtime/security.mjs
        env:
          NEXT_RUNTIME_ARTIFACTS: ${{ runner.temp }}/cold-start-security
      - name: First browser launch with unchanged startup deadline
        env:
          PRELOAD_BROWSER_ASSETS: ${{ matrix.preload }}
          CDP_STARTUP_DIAGNOSTICS: '1'
        run: |
          export REAL_CHROMIUM_PATH="$(command -v chromium)"
          "$REAL_CHROMIUM_PATH" --version
          cat > "$RUNNER_TEMP/cold-browser.sh" <<'LAUNCHER'
          #!/bin/sh
          if [ "$PRELOAD_BROWSER_ASSETS" = true ]; then
            browser_dir=$(dirname "$(readlink -f "$REAL_CHROMIUM_PATH")")
            find "$browser_dir" -maxdepth 1 -type f -print0 | xargs -0 cat > /dev/null
          fi
          exec "$REAL_CHROMIUM_PATH" "$@"
          LAUNCHER
          chmod 700 "$RUNNER_TEMP/cold-browser.sh"
          export CHROMIUM_PATH="$RUNNER_TEMP/cold-browser.sh"
          df -h /tmp /dev/shm
          node --test --test-reporter=spec tests/next-runtime/cdp.test.mjs
