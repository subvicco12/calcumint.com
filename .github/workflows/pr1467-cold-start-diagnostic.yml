name: PR1467 isolated cold-start diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        fixture: [image-stable, pinned-package]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run typecheck
      - name: Same pinned disposable security prelude
        run: |
          docker pull postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          docker pull postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
          node tests/next-runtime/security.mjs
        env:
          NEXT_RUNTIME_ARTIFACTS: ${{ runner.temp }}/cold-start-security
      - name: Provision checksum-pinned isolated browser when selected
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          if [ "$FIXTURE" = pinned-package ]; then
            curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 'https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_156.0.8078.47-1_amd64.deb' -o "$RUNNER_TEMP/browser.deb"
            printf '%s  %s\n' '6c92cd22e90c6e3e255d782991543fa2091db8614e8536a971a7433a5c4d7ac8' "$RUNNER_TEMP/browser.deb" | sha256sum --check
            timeout 120s dpkg-deb --extract "$RUNNER_TEMP/browser.deb" "$RUNNER_TEMP/isolated-browser"
          fi
      - name: First browser launch with unchanged startup deadline
        env:
          FIXTURE: ${{ matrix.fixture }}
          CDP_STARTUP_DIAGNOSTICS: '1'
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          if [ "$FIXTURE" = pinned-package ]; then
            export CHROMIUM_PATH="$RUNNER_TEMP/isolated-browser/opt/google/chrome/chrome"
          fi
          "$CHROMIUM_PATH" --version
          df -h /tmp /dev/shm
          node --test --test-reporter=spec tests/next-runtime/cdp.test.mjs
      - name: Record stable browser binary identity after first launch
        if: always()
        run: |
          installed="$(dirname "$(readlink -f "$(command -v google-chrome)")")/chrome"
          sha256sum "$installed"
          if [ -f "$RUNNER_TEMP/isolated-browser/opt/google/chrome/chrome" ]; then
            sha256sum "$RUNNER_TEMP/isolated-browser/opt/google/chrome/chrome"
          fi
